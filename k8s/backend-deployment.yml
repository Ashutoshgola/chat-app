apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: chat-app
  labels:
    app: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: chatapp-backend
          image: ashutosh78955/chatapp-backend:latest

          ports:
            - containerPort: 5001

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "5001"

            - name: MONGODB_URI
              value: "mongodb://root:admin@mongodb:27017/chatApp?authSource=admin&retryWrites=true&w=majority"

            - name: JWT_SECRET
              value: "your_super_secret_key"