apiVersion: apps/v1
kind : Deployment
metadata:
  name: frontend-deployment
  namespace: chat-app
  labels:
    app: chat-app
spec:
  replicas: 1
  selector:         
    matchLabels:
      app: frontend
  template:
    metadata:
        name: frontend-pod
        namespace: chat-app
        labels:
          app: frontend
    spec:
      containers:
        - name: chatapp-frontend
          image: ashutosh78955/chatapp-frontend:latest
          ports:
            - containerPort: 80
          env:
          - name: NODE_ENV
            value: production
